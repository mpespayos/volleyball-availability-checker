name: Richcraft Volleyball Check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: gha-state.json
          key: gha-state-${{ github.ref_name }}
          restore-keys: |
            gha-state-${{ github.ref_name }}-

      - name: Run checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEADLESS: 'true'
          STATE_FILE: ./gha-state.json
        run: node index.js

      - name: Save updated state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: gha-state.json
          key: gha-state-${{ github.ref_name }}-${{ github.run_id }}
